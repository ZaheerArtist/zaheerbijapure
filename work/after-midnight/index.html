<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>After Midnight | Zaheer Bijapure</title>
<meta name="description" content="A night-time mood piece built on smoke, light and atmosphere.">
<link rel="canonical" href="https://zaheerartist.github.io/work/after-midnight/">
<meta property="og:type" content="article">
<meta property="og:url" content="https://zaheerartist.github.io/work/after-midnight/">
<meta property="og:title" content="After Midnight | Zaheer Bijapure">
<meta property="og:description" content="A night-time mood piece built on smoke, light and atmosphere.">
<meta property="og:image" content="https://i.ytimg.com/vi/Qkfv8MbizyA/hqdefault.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#06090a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--void:#06090a;--deep:#0c1a1c;--edge:#1f3336;--cream:#f2e8d5;--dim:#9aaaa9;--ember:#ff7a2f;--title:"Cinzel","Trajan Pro",Georgia,serif;--script:"Courier Prime","Courier New",Courier,monospace;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--void);color:var(--cream);font:400 1.0625rem/1.65 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}:focus-visible{outline:2px solid var(--ember);outline-offset:3px}p,h1,h2,h3{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:18px;font-family:var(--script);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.top a{text-decoration:none;color:var(--dim)}.top a:hover{color:var(--ember)}.mark{font-family:var(--title);font-weight:700;letter-spacing:.3em;color:var(--cream)!important}
.eyebrow{font-family:var(--script);font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ember)}
h1{font-family:var(--title);font-weight:600;font-size:clamp(2.2rem,7vw,4.6rem);line-height:1.02;letter-spacing:.03em;margin:14px 0 16px;text-wrap:balance}
.log{font-size:clamp(1.05rem,2.2vw,1.25rem);color:#d9d0be;max-width:56ch}
.player{position:relative;display:block;width:100%;aspect-ratio:16/9;margin-top:34px;background:linear-gradient(135deg,var(--deep),#1b2b2d);border:0;padding:0;cursor:pointer;overflow:hidden;color:inherit}
.player img{width:100%;height:100%;object-fit:cover;display:block}
.player .pb{position:absolute;left:18px;bottom:18px;font-family:var(--script);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;background:var(--ember);color:var(--void);padding:11px 16px}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.blocks{display:grid;gap:clamp(40px,6vw,64px);padding-block:clamp(48px,8vw,80px)}
.block h2{font-family:var(--title);font-weight:600;font-size:clamp(1.4rem,3vw,1.9rem);letter-spacing:.03em;margin:8px 0 12px}
.block p{color:#d9d0be;max-width:62ch}
.roles{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.roles li{font-family:var(--script);font-size:.85rem;border:1px solid var(--edge);padding:9px 14px}
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:6px}
.frames figure{margin:0}.frames img{width:100%;display:block}.frames figcaption{margin-top:6px;font-size:.88rem;color:var(--dim)}
.nextbar{border-top:1px solid var(--edge);padding-block:40px 70px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px}
.nextbar a.next{text-decoration:none}.nextbar small{display:block;font-family:var(--script);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.nextbar b{font-family:var(--title);font-size:clamp(1.3rem,3vw,1.8rem);letter-spacing:.03em}.nextbar a.next:hover b{color:var(--ember)}
.btn{display:inline-block;font-family:var(--script);font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;padding:12px 18px;border:1px solid var(--ember);background:var(--ember);color:var(--void);text-decoration:none}
.btn:hover{filter:brightness(1.08)}
footer{padding-block:24px;text-align:center;font-family:var(--title);letter-spacing:.35em;font-size:.75rem;color:var(--dim);border-top:1px solid var(--edge)}
</style>
</head>
<body>
<header class="wrap top"><a class="mark" href="../../">ZB</a><span><a href="../../#work">← All work</a></span></header>
<main>
  <div class="wrap">
    <p class="eyebrow">Case study 02 · AI film</p>
    <h1>After Midnight</h1>
    <p class="log">A night-time mood piece built on smoke, light and atmosphere.</p>
    <button type="button" class="player" data-yt="Qkfv8MbizyA" aria-label="Play After Midnight"><img src="https://i.ytimg.com/vi/Qkfv8MbizyA/hqdefault.jpg" alt="Still from After Midnight" onerror="this.remove()"><span class="pb">▶ Play film</span></button>
  </div>
  <div class="wrap narrow blocks">
    <section class="block"><p class="eyebrow">My contribution</p><h2>Role</h2><ul class="roles"><li>Concept and direction</li><li>AI image and video generation</li><li>Edit and finishing</li></ul></section>
  </div>
  <div class="wrap nextbar">
    <a class="next" href="../innocence/"><small>Next case study</small><b>Innocence →</b></a>
    <a class="btn" href="../../#contact">Discuss a project</a>
  </div>
</main>
<footer>© Zaheer Bijapure · UAE</footer>
<script>
document.querySelectorAll('.player[data-yt]').forEach(function(b){b.addEventListener('click',function(){var f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+b.dataset.yt+'?autoplay=1&rel=0';f.title=b.getAttribute('aria-label');f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;b.replaceChildren(f);},{once:true});});
</script>
</body>
</html>
